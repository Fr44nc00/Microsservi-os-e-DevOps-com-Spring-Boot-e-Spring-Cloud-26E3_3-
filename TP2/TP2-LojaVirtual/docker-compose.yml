version: '3.8'

services:
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8080:8080"
    networks:
      - loja-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8081:8081"
    networks:
      - loja-network
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8080

networks:
  loja-network:
    driver: bridge
