apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-image:latest
          ports:
            - containerPort: 8081
          env:
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8080